name: Daily auto-build

# Re-runs build.py once a day so the "Today / Up-next" panel and the
# today/upcoming/archived classification stay current without a human push.
# Also runnable on demand from the Actions tab.

on:
  schedule:
    # 09:00 UTC daily (~ early morning San Francisco / late afternoon CET)
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run build.py
        run: python3 src/build.py

      - name: Commit regenerated public/ if changed
        run: |
          if [ -z "$(git status --porcelain public/)" ]; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/
          git commit -m "chore: daily auto-build $(date -u +%Y-%m-%d)"
          git push
