name: Dust event auto-feed (manual only)

# Asks the ArcticBlueEventSpeaking Dust agent for newly-found speaking events
# and POSTs them to /api/events (the OpenAI gate filters them). Nothing is
# committed — this only writes to Supabase via the ingest endpoint.
#
# IMPORTANT — COST: this path calls the Dust *API*, which spends Dust *API
# tokens* and starts a brand-new agent run each time. The preferred path is
# the IN-CHAT one: the Dust agent itself POSTs to /api/events from your normal
# chatbot runs (uses in-chat tokens, no extra runs). This workflow is kept
# ONLY as an on-demand fallback — there is intentionally NO schedule, so it
# never runs (or bills) on its own. To re-enable a cadence, add a `schedule:`
# block back under `on:`.

on:
  workflow_dispatch: {}

permissions:
  contents: read

# Never let two feed runs overlap (the agent + gate can take a couple minutes).
concurrency:
  group: dust-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Dust feed
        env:
          DUST_API_KEY:         ${{ secrets.DUST_API_KEY }}
          EVENTS_INGEST_SECRET: ${{ secrets.EVENTS_INGEST_SECRET }}
          # Optional overrides — only set these as repo secrets/vars if you
          # ever move the deployment or change the workspace/agent.
          EVENTS_ENDPOINT:   ${{ vars.EVENTS_ENDPOINT }}
          DUST_WORKSPACE_ID: ${{ vars.DUST_WORKSPACE_ID }}
          DUST_AGENT_ID:     ${{ vars.DUST_AGENT_ID }}
          DUST_DOMAIN:       ${{ vars.DUST_DOMAIN }}
          DUST_FEED_COUNT:   ${{ vars.DUST_FEED_COUNT }}
        run: python3 scripts/dust_feed.py
